<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resource Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fw-bold mb-0">Resource Repository</h2>
      <a href="./admin.html" class="btn btn-outline-secondary btn-sm">Admin Portal</a>
    </div>

    <!-- Search & Filter Controls -->
    <div class="row g-2 mb-4">
      <div class="col-md-8">
        <input type="text" id="searchInput" class="form-control" placeholder="Search by title or description...">
      </div>
      <div class="col-md-4">
        <select id="categoryFilter" class="form-select">
          <option value="ALL">All Categories</option>
          <option value="Archives">Archives (.zip)</option>
          <option value="Documents">Documents (PDF/Doc)</option>
          <option value="Images">Images</option>
        </select>
      </div>
    </div>

    <!-- Container rendered by js/app.js -->
    <div id="itemsContainer" class="row g-3">
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">Loading resources...</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
