<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Upload</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5" style="max-width: 650px;">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
        <h5 class="mb-0">Resource Management</h5>
        <a href="./index.html" class="btn btn-sm btn-outline-light">Back to Site</a>
      </div>
      <div class="card-body p-4">

        <div id="statusAlert" class="alert d-none" role="alert"></div>

        <form id="uploadForm">
          <div class="mb-3">
            <label for="ghToken" class="form-label fw-bold">GitHub Token (Fine-Grained PAT)</label>
            <input type="password" class="form-control" id="ghToken" required placeholder="github_pat_...">
            <div class="form-text">Requires 'Contents: Read & Write' permission. Stored only in session.</div>
          </div>

          <hr class="my-3">

          <div class="mb-3">
            <label for="itemTitle" class="form-label fw-bold">Title</label>
            <input type="text" class="form-control" id="itemTitle" required placeholder="e.g. Standard X Resources">
          </div>

          <div class="mb-3">
            <label for="itemCategory" class="form-label fw-bold">Category</label>
            <select class="form-select" id="itemCategory" required>
              <option value="Archives">Archives (.zip)</option>
              <option value="Documents">Documents (PDF / Office)</option>
              <option value="Images">Images</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="itemDescription" class="form-label">Description (Optional)</label>
            <textarea class="form-control" id="itemDescription" rows="2" placeholder="Brief details about the resource..."></textarea>
          </div>

          <div class="mb-4">
            <label for="fileInput" class="form-label fw-bold">File (Max 25 MB)</label>
            <input class="form-control" type="file" id="fileInput" required>
          </div>

          <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2">
            Upload & Commit to GitHub
          </button>
        </form>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/admin.js"></script>
</body>
</html>
